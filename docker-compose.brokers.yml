# MÁQUINA 2 — 10 Áreas/Brokers com TCP + Lamport
# docker compose -f docker-compose.brokers.yml up --build
networks:
  ormuz-brokers:
    driver: bridge

services:
  area-01:
    build: { context: ., dockerfile: brokers/Dockerfile, args: { AREA_FILE: area_01.py } }
    container_name: area-01
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MAQUINA_TORRES_IP: "${MAQUINA_TORRES_IP:-192.168.1.10}"
      AREA_ID: area-01
      AREA_NOME: "Setor Alfa — Canal Norte"
      AREA_PORT: "7001"
      AREA_HTTP_PORT: "7101"
    ports: ["7001:7001","7101:7101"]
    networks: [ormuz-brokers]
    restart: unless-stopped

  area-02:
