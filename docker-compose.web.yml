# MÁQUINA 3 — Interface Web
# docker compose -f docker-compose.web.yml up --build
# Acesse: http://<IP_MAQUINA_3>:8080
networks:
  ormuz-web:
    driver: bridge

services:
  web:
    build: { context: ., dockerfile: web/Dockerfile }
    container_name: ormuz-web
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      MAQUINA_TORRES_IP:  "${MAQUINA_TORRES_IP:-192.168.1.10}"
      MAQUINA_BROKERS_IP: "${MAQUINA_BROKERS_IP:-192.168.1.20}"
      MAQUINA_WEB_IP:     "${MAQUINA_WEB_IP:-192.168.1.30}"
      WEB_PORTA: "8080"
    ports: ["8080:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ormuz-web]
    restart: unless-stopped
